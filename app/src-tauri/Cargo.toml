[package]
name = "steadcopy-app"
description = "稳拷 steadcopy 桌面应用"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "steadcopy_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
steadcopy-core = { path = "../../crates/steadcopy-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "local-offset"] }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-notification = "2.3.3"
tauri-plugin-updater = "2.10.1"
# 更新下载地址的主机白名单要按 URL 语义判定，不能用字符串前缀——
# `api.ai-mcn.tv.attacker.com` 和 `api.ai-mcn.tv@attacker.com` 都以白名单主机开头。
# 不是新依赖：tauri 与 updater 本来就把它编进来了，这里只是显式声明。
url = "2"
# 只为了给更新器装一个自定义重定向策略（reqwest::redirect::Policy::custom）。
# tauri-plugin-updater 的 configure_client 收的是 reqwest::ClientBuilder，而它不再导出 reqwest，
# 所以必须显式声明。不是新依赖：updater 本来就把它编进来了，版本会归一到同一份。
reqwest = { version = "0.13", default-features = false }
